
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet 1 - Personnes</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        fieldset {
            margin-bottom: 15px;
            padding: 10px;
        }

        .personne {
            clear: both;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            min-height: 90px;
        }

        .personne img {
            float: left;
            margin-right: 20px;
        }

        input[type="checkbox"], select {
            margin-right: 15px;
        }

        .misEnForme {
            background-color: #e0ffff;
            font-family: Georgia;
            font-size: 1.2rem;
        }

        button {
            margin-top: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="app">

   
    <fieldset>
        <legend>Filtre sur le nom</legend>

        <input type="text"
               v-model="filtreNom"
               placeholder="Rechercher un nom">
    </fieldset>

    
    <fieldset>
        <legend>Options</legend>

        Homme
        <input type="checkbox" v-model="homme">

        Femme
        <input type="checkbox" v-model="femme">

        Téléphone
        <input type="checkbox" v-model="tel">

        Photo
        <select v-model="taille">
            <option value="thumbnail">Petit</option>
            <option value="medium">Moyen</option>
            <option value="large">Grand</option>
        </select>

        Mise en forme
        <input type="checkbox" v-model="mef">

    </fieldset>

    
    <p v-if="erreur" style="color:red">
        {{ erreur }}
    </p>

    
    <div v-for="p in personnesFiltrees"
         :key="p.login.uuid"
         class="personne"
         :class="{ misEnForme: mef }">

        <!-- Photo -->
        <img :src="p.picture[taille]">

        
        <div>
            <strong>Nom :</strong> {{ p.name.last }}
            <br>

            <strong>Prénom :</strong> {{ p.name.first }}
            <br>

            <strong>Pays :</strong> {{ p.location.country }}
            <br>

            
            <div v-if="tel">
                <strong>Téléphone :</strong>

                <span v-if="contactsVisibles[p.login.uuid]">
                    {{ p.phone }}
                </span>

                <span v-else>
                    ********
                </span>
            </div>

            
            <div>
                <strong>Email :</strong>

                <span v-if="contactsVisibles[p.login.uuid]">
                    {{ p.email }}
                </span>

                <span v-else>
                    ********
                </span>
            </div>

            
            <button @click="basculerContacts(p)">
                {{ contactsVisibles[p.login.uuid]
                   ? 'Cacher les contacts'
                   : 'Afficher les contacts' }}
            </button>

        </div>

    </div>

</div>

<script>

const app = Vue.createApp({

    data() {
        return {

            homme: true,
            femme: true,
            tel: true,

            mef: false,

            taille: 'medium',

            filtreNom: '',

            personnes: [],

            contactsVisibles: {},

            erreur: ''

        };
    },

    
    computed: {

        personnesFiltrees() {

            return this.personnes.filter(p => {

                // Filtre homme / femme
                let genre =
                    (this.homme && p.gender === 'male') ||
                    (this.femme && p.gender === 'female');

                // Filtre sur le nom
                let nom = p.name.last
                    .toLowerCase()
                    .includes(this.filtreNom.toLowerCase());

                return genre && nom;

            });

        }

    },

    
    methods: {

        basculerContacts(p) {

            let id = p.login.uuid;

            this.contactsVisibles[id] =
                !this.contactsVisibles[id];

        }

    },

    
    async mounted() {

        try {

            const reponse = await fetch('./personnes.json');

            if (!reponse.ok) {
                throw new Error('Fichier JSON introuvable');
            }

            this.personnes = await reponse.json();

        } catch (erreur) {

            this.erreur =
                'Erreur : impossible de charger personnes.json';

            console.error(erreur);

        }

    }

});

app.mount('#app');

</script>

</body>
</html>


</html>
